<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE TITLE — UAP Cyprus Centre</title>
<link rel="stylesheet" href="../style.css?v=16">
<style>
.info-pills { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
.info-pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 1rem 1.25rem; }
.info-pill .label { font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase; color: #7dd3fc; font-weight: 700; margin-bottom: 0.35rem; }
.info-pill .value { font-size: 1.15rem; color: #ffffff; font-weight: 700; }
.case-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1.25rem; }
.case-gallery img { width: 100%; height: 240px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(148,163,184,0.3); }
.back-link { display: inline-block; color: #7dd3fc; text-decoration: none; font-weight: 600; margin-bottom: 1.5rem; font-size: 1.05rem; }
.back-link:hover { color: #38bdf8; }
</style>
</head>
<body>

<!-- Same nav bar as case-paphos.html — copy it verbatim -->

<section class="hero">
  <div class="hero-content">
    <h1>CASE TITLE HERE</h1>
    <p>DATE · LOCATION</p>
  </div>
</section>

<div class="galaxy-bg">
  <main class="content">

    <a href="../cyprus-cases.html" class="back-link">← Back to all Cyprus Cases</a>

    <div class="section-block card-1">
      <div class="info-pills">
        <div class="info-pill"><div class="label">Date</div><div class="value">—</div></div>
        <div class="info-pill"><div class="label">Location</div><div class="value">—</div></div>
        <div class="info-pill"><div class="label">Type</div><div class="value">—</div></div>
      </div>
    </div>

    <div class="section-block card-2">
      <h2>Description</h2>
      <p>Case description goes here.</p>
    </div>

    <div class="section-block card-3">
      <h2>Source Material</h2>
      <div class="case-gallery">
        <img src="../images/case-XXX/1.jpg" alt="Image 1">
      </div>
    </div>

    <div class="section-block card-4">
      <h2>Notes</h2>
      <p>Additional notes.</p>
    </div>

  </main>
</div>

<footer class="site-footer">© Fieland WebArts 2024–2026 · UAP Cyprus Centre</footer>

<script>
  document.querySelectorAll('.nav-menu > li > a').forEach(link => {
    link.addEventListener('click', e => {
      const parent = link.parentElement;
      if (parent.querySelector('.dropdown') && window.innerWidth <= 1000) {
        e.preventDefault();
        parent.classList.toggle('open');
      }
    });
  });
</script>

</body>
</html>
