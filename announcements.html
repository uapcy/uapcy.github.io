<style>
.announcement {
  /* Dark background to make white text readable against the white page */
  background: #1a2a40; 
  border: 1px solid rgba(56,189,248,0.2);
  border-radius: 12px;
  padding: 1.8rem;
  margin-bottom: 1.5rem;
  transition: background 0.3s ease;
}
/* Hover effect to make it feel interactive */
.announcement:hover {
  background: #1e304a;
}
/* Remove the bottom border logic since we now use full cards */
.announcement:last-child { 
  border-bottom: 1px solid rgba(56,189,248,0.2); 
  padding-bottom: 1.8rem; 
  margin-bottom: 0;
}

.announcement-date {
  display: inline-block;
  font-size: 0.85rem;
  font-weight: 700;
  color: #7dd3fc;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}
.announcement-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.35;
  margin-bottom: 0.85rem;
}
.announcement-body {
  font-size: 0.98rem;
  color: #ffffff;
  opacity: 0.95;
  line-height: 1.7;
  margin-bottom: 0.75rem;
}
.announcement-body p { margin-bottom: 0.75rem; }
.announcement-body p:last-child { margin-bottom: 0; }

.announcement-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.2rem;
}
.announcement-links a {
  display: inline-block;
  padding: 0.6rem 1.1rem;
  background: #0a3a47;
  color: #ffffff !important;
  text-decoration: none !important;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  border: 1px solid rgba(15,118,110,0.6);
  transition: background 0.2s;
}
.announcement-links a:hover { background: #0d5c6e; }

/* ---- 50/50 split layout: video left, text right ---- */
.split-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  margin-top: 1rem;
  align-items: flex-start;
}
.split-layout .video-embed {
  flex: 1 1 calc(50% - 0.75rem);
  min-width: 260px;
}
.split-layout .split-text {
  flex: 1 1 calc(50% - 0.75rem);
  min-width: 260px;
}
.video-embed {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(56,189,248,0.35);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  background: #000;
}
.video-embed iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.split-text {
  font-size: 0.98rem;
  color: #ffffff;
  opacity: 0.95;
  line-height: 1.7;
}
.split-text p { margin-bottom: 0.85rem; }
.split-text p:last-child { margin-bottom: 0; }

@media (max-width: 800px) {
  .split-layout .video-embed,
  .split-layout .split-text {
    flex: 1 1 100%;
  }
  .announcement {
    padding: 1.25rem;
  }
}
</style>
